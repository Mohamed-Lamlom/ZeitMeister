<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="description" content="Practice reading analog clocks and telling the time in German, with informal and official forms.">
<meta name="theme-color" id="themeColor" content="#f6f3ec">
<script>
// Keep ZeitMeister theme independent from the browser/OS appearance setting.
try {
  const savedTheme = localStorage.getItem("gc_theme");
  document.documentElement.dataset.theme = savedTheme === "dark" ? "dark" : "light";
} catch (_) {
  document.documentElement.dataset.theme = "light";
}
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="ZeitMeister">
<title>ZeitMeister — German Time Trainer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="brandbar" aria-label="ZeitMeister">
  <svg class="brandmark" viewBox="0 0 64 64" aria-hidden="true">
    <path d="M9 20h8" stroke="#1d2433" stroke-width="4" stroke-linecap="round"/>
    <path d="M6 28h11" stroke="#d5ad3f" stroke-width="4" stroke-linecap="round"/>
    <path d="M9 36h9" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="33" cy="32" r="23" fill="var(--card)" stroke="var(--fg)" stroke-width="4"/>
    <circle cx="33" cy="32" r="18" fill="none" stroke="var(--muted)" stroke-width="1.4" opacity=".55"/>
    <line x1="33" y1="32" x2="33" y2="19" stroke="var(--fg)" stroke-width="4" stroke-linecap="round"/>
    <line x1="33" y1="32" x2="45" y2="36" stroke="var(--fg)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="33" y1="32" x2="33" y2="13" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="33" cy="32" r="3.2" fill="var(--accent)"/>
  </svg>
  <div class="brandcopy">
    <div class="brandname"><span class="zeit">Zeit</span><span class="meister">Meister</span></div>
    <div class="brandtag">German Time Trainer</div>
  </div>
</header>
<div class="wrap">
  <div class="clock" id="clock" role="button" tabindex="0" data-i18n-aria="clockA11y">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <circle cx="100" cy="100" r="94" fill="var(--card)" stroke="var(--fg)" stroke-width="4"/>
      <g id="ticks"></g>
      <g id="nums" font-size="15" font-weight="700" text-anchor="middle" fill="var(--fg)" font-family="Arial,sans-serif"></g>
      <line id="h" x1="100" y1="100" x2="100" y2="58" stroke="var(--fg)" stroke-width="6" stroke-linecap="round"/>
      <line id="m" x1="100" y1="100" x2="100" y2="34" stroke="var(--fg)" stroke-width="4" stroke-linecap="round"/>
      <line id="s" x1="100" y1="110" x2="100" y2="28" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
      <circle cx="100" cy="100" r="5" fill="var(--accent)"/>
    </svg>
  </div>
  <div class="side">
    <h1 data-i18n="h1"></h1>
    <p class="hint tip" data-i18n="tip"></p>
    <p class="hint tip-mobile" data-i18n-aria="tipMobileA11y"><span data-i18n="tipMobileStart"></span><span class="tip-mobile-arrow" aria-hidden="true">↑</span><span data-i18n="tipMobileThen"></span><span class="tip-mobile-arrow" aria-hidden="true">↓</span></p>
    <div class="sum" id="sum"></div>
    <div class="answer" id="answer" role="button" tabindex="0" data-i18n-aria="revealA11y">
      <div class="de" id="de">–</div>
      <div class="cover" data-i18n="cover"></div>
    </div>
    <button class="btn" id="live" data-i18n="live"></button>
    <div class="chips" id="chips">
      <div class="chip" id="c-cur"><span data-i18n="chipStreak"></span><b>0</b><small></small></div>
      <div class="chip" id="c-ten"><span data-i18n="chipTen"></span><b>0</b><small>0/10</small></div>
      <div class="chip" id="c-best"><span data-i18n="chipBest"></span><b>0</b><small></small></div>
    </div>
    <div class="hint" id="score" aria-live="polite"></div>
    <div class="extras" id="extras" hidden><div id="ex"></div></div>
    <div id="rev" hidden><div class="opts" id="opts"></div><div id="revres" aria-live="polite"></div><button class="btn" id="nextq" data-i18n="newq"></button></div>
    <div class="typebox" id="typebox" hidden>
      <input id="inp" type="text" data-i18n-aria="inputA11y" aria-label="German time answer" placeholder="Es ist ..." maxlength="120" enterkeyhint="done" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button class="btn" id="chk" data-i18n="chk"></button>
      <div id="res" aria-live="polite"></div>
    </div>
  </div>
</div>
<button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark theme" title="Switch to dark theme">
  <svg class="theme-icon" id="themeIconMoon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M20.7 13A8.5 8.5 0 0 1 11 3.3 8.5 8.5 0 1 0 20.7 13Z"/>
  </svg>
  <svg class="theme-icon" id="themeIconSun" viewBox="0 0 24 24" aria-hidden="true" hidden>
    <circle cx="12" cy="12" r="4"/>
    <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/>
  </svg>
</button>
<button class="gear" id="gear" data-i18n-aria="settings" data-i18n-title="settings">⚙️</button>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
  <div class="panel">
    <div class="ph"><b id="settingsTitle" data-i18n="settings"></b><button class="x" id="close" data-i18n-aria="close">✕</button></div>
    <div class="lbl" data-i18n="lblLang"></div>
    <div class="seg" id="segL">
      <button data-lang="ar">العربية</button>
      <button data-lang="en">English</button>
      <button data-lang="de">Deutsch</button>
    </div>
    <div class="lbl" data-i18n="lblStyle"></div>
    <div class="seg" id="seg2">
      <button data-style="inf" class="on" data-i18n="infLabel"></button>
      <button data-style="off" data-i18n="offLabel"></button>
    </div>
    <div class="lbl" data-i18n="lblMode"></div>
    <div class="seg" id="seg3">
      <button data-mode="read" class="on" data-i18n="modeRead"></button>
      <button data-mode="type" data-i18n="modeType"></button>
      <button data-mode="rev" data-i18n="modeRev"></button>
    </div>
    <div class="rev-prefs" id="revPrefs" hidden>
      <div class="lbl" data-i18n="lblClockLevel"></div>
      <div class="rev-grid" id="revSeg">
        <button data-revstyle="numbered-step" class="on" data-i18n="revNormal"></button>
        <button data-revstyle="blank-step" data-i18n="revMedium"></button>
        <button data-revstyle="blank-free" data-i18n="revHard"></button>
        <button data-revstyle="blank-impossible" data-i18n="revImpossible"></button>
      </div>
    </div>
    <div class="lbl" data-i18n="lblTimes"></div>
    <div class="seg" id="seg">
      <button data-step="60" data-i18n="stepHour"></button>
      <button data-step="15" data-i18n="step15"></button>
      <button data-step="5" class="on" data-i18n="step5"></button>
      <button data-step="1" data-i18n="step1"></button>
    </div>
    <div class="toggles">
      <label class="hint rl"><span data-i18n="round"></span><input type="checkbox" id="round"></label>
    </div>
    <div class="settings-actions">
      <button type="button" class="btn mini" id="rst" data-i18n="rst"></button>
      <button type="button" class="btn mini" id="progressBtn" data-i18n="progress" aria-controls="progressPopup" aria-expanded="false"></button>
    </div>
    <div class="progress-popup" id="progressPopup" hidden role="region" aria-labelledby="progressTitle">
      <div class="progress-popup-head">
        <b id="progressTitle" data-i18n="progressTitle"></b>
        <button type="button" class="x" id="progressClose" data-i18n-aria="close" data-i18n-title="close">✕</button>
      </div>
      <section class="progress-mode" aria-labelledby="progressTypeTitle">
        <h3 id="progressTypeTitle" data-i18n="progressType"></h3>
        <div class="progress-stat"><span data-i18n="progressAttempted"></span><b id="progressTypeAttempted">0</b></div>
        <div class="progress-stat"><span data-i18n="progressCorrect"></span><b id="progressTypeCorrect">0</b></div>
        <div class="progress-stat"><span data-i18n="progressAccuracy"></span><b id="progressTypeAccuracy">0%</b></div>
      </section>
      <section class="progress-mode" aria-labelledby="progressReverseTitle">
        <h3 id="progressReverseTitle" data-i18n="progressReverse"></h3>
        <div class="progress-stat"><span data-i18n="progressAttempted"></span><b id="progressReverseAttempted">0</b></div>
        <div class="progress-stat"><span data-i18n="progressCorrect"></span><b id="progressReverseCorrect">0</b></div>
        <div class="progress-stat"><span data-i18n="progressAccuracy"></span><b id="progressReverseAccuracy">0%</b></div>
      </section>
    </div>
  </div>
</div>
<script src="js/app.js" defer></script>
<script>
// Service workers require HTTPS or localhost. The downloaded static files still
// work locally without a service worker; this enables offline caching when hosted.
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js", { scope: "./" })
      .catch((error) => console.warn("ZeitMeister offline cache could not be enabled:", error));
  });
}
</script>
</body>
</html>
